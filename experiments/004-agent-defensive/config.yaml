experiment: 004-agent-defensive
description: >
  Measure 2 of 3 parallel improvement attempts after experiment 002. Adds
  defensive/resource-targeting logic on top of heuristic_v2_agent: conditional
  retreat when critically damaged, healthiest-bench-first switching, and
  energy-attach targeting that still prioritizes the active attacker (a first
  version that targeted "whichever Pokemon needs least energy" regardless of
  active/bench lost 39.5% head-to-head to v2 -- fixed by keeping the active
  attacker's own tempo as the default). Deck unchanged from 002
  (data/decks/optimized_v2.csv, Fire) -- isolates an agent-only change.
